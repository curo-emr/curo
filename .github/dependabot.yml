# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR per
# ecosystem; each major bump gets its own PR, since those can break the build.
version: 2
updates:
  - package-ecosystem: npm
    directory: / # the root lockfile covers every workspace
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
