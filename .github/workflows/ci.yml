name: CI

on:
  push:
    branches: [main, "dev-release/**", "qa-release/**", "stg-release/**"]
  pull_request:

# A new push to a PR cancels its older run; runs on long-lived branches always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backends
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curo
          POSTGRES_PASSWORD: curo_secret
          POSTGRES_DB: curo_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curo -d curo_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Workspaces run in declaration order, so @curo/shared builds before the services.
      - run: npm run build
      # Any lint error or warning fails the build.
      - run: npm run lint
      - run: npm test
      # API tests: each service against curo_test, recreated and migrated on the same server.
      - run: npm run test:e2e
      # tsc over every workspace, tests included (nest build skips them), and database/.
      - run: npm run typecheck
      # Against an empty database: migrations apply, entities match them, and the seed runs.
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run seed

  portals:
    name: Portal (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin, doctor, lab, nurse, patient, pharmacy, receptionist]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next build also type-checks the app.
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the full history; allowlist lives in .gitleaks.toml.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
