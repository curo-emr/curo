name: CI

on:
  push:
    branches: [main, "dev-release/**", "qa-release/**", "stg-release/**"]
  pull_request:

# A new push to a PR cancels its older run; runs on long-lived branches always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What to check: a pull request checks what it changes, anything else checks
  # everything. The rules are in .github/scripts/ci-scope.sh.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: .github/scripts/ci-scope.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  backend:
    name: Backends
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curo
          POSTGRES_PASSWORD: curo_secret
          POSTGRES_DB: curo_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curo -d curo_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The root tooling plus packages/ and services/; the Frontend jobs install the portals.
      - run: npm ci --include-workspace-root -w packages -w services
      # Workspaces run in declaration order, so @curo/shared builds before the services.
      - run: npm run build
      # Any lint error or warning fails the build.
      - run: npm run lint
      - run: npm test
      # API tests: each service against curo_test, recreated and migrated on the same server.
      - run: npm run test:e2e
      # tsc over every workspace, tests included (nest build skips them), and database/.
      - run: npm run typecheck
      # Against an empty database: migrations apply, entities match them, and the seed runs.
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run seed

  frontend:
    name: Frontend (${{ matrix.workspace }})
    needs: scope
    if: needs.scope.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each portal, and @curo/web, that the change can affect.
        workspace: ${{ fromJSON(needs.scope.outputs.frontend) }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Only this workspace's dependencies (a portal's include @curo/web), from the root lockfile.
      - run: npm ci --workspace ${{ matrix.workspace }}
      - run: npm run lint --workspace ${{ matrix.workspace }}
      # A portal's next build also type-checks it and the @curo/web code it uses; @curo/web
      # itself is type-checked by the Backends job's `npm run typecheck`.
      - run: npm run build --workspace ${{ matrix.workspace }} --if-present

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the full history; allowlist lives in .gitleaks.toml.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  # The one check a branch ruleset requires. The jobs above are skipped when a
  # change can't affect them, and the Frontend jobs' names depend on the change,
  # so none of them can be required on its own. This one always runs, and fails
  # when any of them failed or was cancelled; skipped is fine.
  result:
    name: CI
    needs: [scope, backend, frontend, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
