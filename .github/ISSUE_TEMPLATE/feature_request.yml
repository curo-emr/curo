name: Feature request
description: Suggest something Curo should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**Never include real patient data.** Describe workflows with made-up examples."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin portal
        - Doctor portal
        - Lab portal
        - Nurse portal
        - Patient portal
        - Pharmacy portal
        - Receptionist portal
        - Backend / API
        - Database / migrations
        - Docker / setup
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what can't they do today? E.g. "Nurses can't see a patient's previous vitals while triaging."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like Curo to do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other approaches you considered.
