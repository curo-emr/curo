version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: curo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curo
      POSTGRES_PASSWORD: curo_secret
      POSTGRES_DB: curo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curo -d curo_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curo_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
