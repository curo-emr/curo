# Host ports: only the gateway (3000) and the portals (3010–3016) are published.
# Backends are reachable only on the compose network, through the gateway.
# Postgres and MinIO listen on 127.0.0.1 only, for running a service or the
# migrations from source.

# ─────────────────────────────────────────────────────────────────────────────
# Secrets, read from .env (git-ignored): `cp .env.example .env` before the
# first `docker compose up`. Compose refuses to start while any is unset.
# ─────────────────────────────────────────────────────────────────────────────
x-secrets:
  db-pass: &db-pass ${DB_PASS:?set DB_PASS in .env (see .env.example)}
  jwt-secret: &jwt-secret ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
  jwt-refresh-secret: &jwt-refresh-secret ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (see .env.example)}
  minio-access-key: &minio-access-key ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env (see .env.example)}
  minio-secret-key: &minio-secret-key ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env (see .env.example)}

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment fragments
# ─────────────────────────────────────────────────────────────────────────────
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: curo
  DB_PASS: *db-pass
  DB_NAME: curo_db

x-jwt-env: &jwt-env
  JWT_SECRET: *jwt-secret
  JWT_REFRESH_SECRET: *jwt-refresh-secret
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

x-backend-build: &backend-build
  context: .
  dockerfile: services/Dockerfile

x-portal-build: &portal-build
  dockerfile: ../Dockerfile
  args:
    NEXT_PUBLIC_API_URL: http://localhost:3000

x-db-tools-build: &db-tools-build
  context: .
  dockerfile: database/Dockerfile

# Domain backends start only once migrations have run.
x-needs-migrated-db: &needs-migrated-db
  curo-migrate:
    condition: service_completed_successfully

# Every backend serves GET /health on its PORT ($$ escapes compose interpolation).
x-backend-healthcheck: &backend-healthcheck
  test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT}/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 40s

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: curo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curo
      POSTGRES_PASSWORD: *db-pass
      POSTGRES_DB: curo_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curo -d curo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curo_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: curo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: *minio-access-key
      MINIO_ROOT_PASSWORD: *minio-secret-key
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend services ─────────────────────────────────────────────────────────
  curo-auth-service:
    build:
      <<: *backend-build
      args:
        SERVICE: auth
    container_name: curo_auth
    restart: unless-stopped
    environment:
      PORT: "3001"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-patient-service:
    build:
      <<: *backend-build
      args:
        SERVICE: patient
    container_name: curo_patient
    restart: unless-stopped
    environment:
      PORT: "3002"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-appointment-service:
    build:
      <<: *backend-build
      args:
        SERVICE: appointment
    container_name: curo_appointment
    restart: unless-stopped
    environment:
      PORT: "3003"
      CURRENCY: ${CURRENCY:-LKR}
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-clinical-service:
    build:
      <<: *backend-build
      args:
        SERVICE: clinical
    container_name: curo_clinical
    restart: unless-stopped
    environment:
      PORT: "3004"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-pharmacy-service:
    build:
      <<: *backend-build
      args:
        SERVICE: pharmacy
    container_name: curo_pharmacy_svc
    restart: unless-stopped
    environment:
      PORT: "3005"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-lab-service:
    build:
      <<: *backend-build
      args:
        SERVICE: lab
    container_name: curo_lab_svc
    restart: unless-stopped
    environment:
      PORT: "3006"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-document-service:
    build:
      <<: *backend-build
      args:
        SERVICE: document
    container_name: curo_document
    restart: unless-stopped
    environment:
      PORT: "3009"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: *minio-access-key
      MINIO_SECRET_KEY: *minio-secret-key
      MINIO_BUCKET: curo-documents
      <<: [*db-env, *jwt-env]
    depends_on:
      <<: *needs-migrated-db
      minio:
        condition: service_started
    healthcheck: *backend-healthcheck

  curo-notification-service:
    build:
      <<: *backend-build
      args:
        SERVICE: notification
    container_name: curo_notification
    restart: unless-stopped
    environment:
      PORT: "3007"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-audit-service:
    build:
      <<: *backend-build
      args:
        SERVICE: audit
    container_name: curo_audit
    restart: unless-stopped
    environment:
      PORT: "3008"
      <<: [*db-env, *jwt-env]
    depends_on: *needs-migrated-db
    healthcheck: *backend-healthcheck

  curo-api-gateway:
    build:
      <<: *backend-build
      args:
        SERVICE: api-gateway
    container_name: curo_gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      JWT_SECRET: *jwt-secret
      AUTH_SERVICE_URL: http://curo-auth-service:3001
      PATIENT_SERVICE_URL: http://curo-patient-service:3002
      APPOINTMENT_SERVICE_URL: http://curo-appointment-service:3003
      CLINICAL_SERVICE_URL: http://curo-clinical-service:3004
      PHARMACY_SERVICE_URL: http://curo-pharmacy-service:3005
      LAB_SERVICE_URL: http://curo-lab-service:3006
      DOCUMENT_SERVICE_URL: http://curo-document-service:3009
      NOTIFICATION_SERVICE_URL: http://curo-notification-service:3007
      AUDIT_SERVICE_URL: http://curo-audit-service:3008
      # browser-facing origins stay as localhost (host machine ports)
      FRONTEND_ORIGINS: http://localhost:3010,http://localhost:3011,http://localhost:3012,http://localhost:3013,http://localhost:3014,http://localhost:3015,http://localhost:3016
    ports:
      - "3000:3000"
    depends_on:
      curo-auth-service:
        condition: service_healthy
      curo-patient-service:
        condition: service_healthy
      curo-appointment-service:
        condition: service_healthy
      curo-clinical-service:
        condition: service_healthy
      curo-pharmacy-service:
        condition: service_healthy
      curo-lab-service:
        condition: service_healthy
      curo-document-service:
        condition: service_healthy
      curo-notification-service:
        condition: service_healthy
      curo-audit-service:
        condition: service_healthy
    healthcheck: *backend-healthcheck

  # ── Database tooling (one-shot: run, then exit) ────────────────────────────────
  curo-migrate:
    build: *db-tools-build
    container_name: curo_migrate
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  curo-seed:
    build: *db-tools-build
    container_name: curo_seed
    restart: "no"
    command: ["npm", "run", "seed"]
    environment:
      <<: *db-env
    depends_on: *needs-migrated-db

  # ── Frontends ─────────────────────────────────────────────────────────────────
  # NEXT_PUBLIC_API_URL is baked in at build time (browser uses host-exposed port 3000);
  # see x-portal-build above.
  curo-doctor:
    build:
      <<: *portal-build
      context: ./apps/doctor
    container_name: curo_doctor_ui
    restart: unless-stopped
    environment:
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3010:3010"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-patient-portal:
    build:
      <<: *portal-build
      context: ./apps/patient
    container_name: curo_patient_ui
    restart: unless-stopped
    environment:
      PORT: "3011"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3011:3011"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-receptionist:
    build:
      <<: *portal-build
      context: ./apps/receptionist
    container_name: curo_receptionist_ui
    restart: unless-stopped
    environment:
      PORT: "3012"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3012:3012"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-lab-portal:
    build:
      <<: *portal-build
      context: ./apps/lab
    container_name: curo_lab_ui
    restart: unless-stopped
    environment:
      PORT: "3013"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3013:3013"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-pharmacy-portal:
    build:
      <<: *portal-build
      context: ./apps/pharmacy
    container_name: curo_pharmacy_ui
    restart: unless-stopped
    environment:
      PORT: "3014"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3014:3014"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-admin:
    build:
      <<: *portal-build
      context: ./apps/admin
    container_name: curo_admin_ui
    restart: unless-stopped
    environment:
      PORT: "3015"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3015:3015"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

  curo-nurse:
    build:
      <<: *portal-build
      context: ./apps/nurse
    container_name: curo_nurse_ui
    restart: unless-stopped
    environment:
      PORT: "3016"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3016:3016"
    depends_on:
      curo-api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
